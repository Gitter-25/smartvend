project_id = "smartvend"

[functions.card-management]
# The handler validates the session with Auth.getUser and checks admin membership.
# This permits current signing keys without relying on the legacy gateway check.
verify_jwt = false

[functions.device-vending]
# The handler checks the dedicated machine token; admin JWTs are not device credentials.
verify_jwt = false

[functions.qr-payments]
# Admin/device authentication and test webhook signatures are verified inside the handler.
verify_jwt = false
